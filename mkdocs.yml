site_name: rosetta
site_description: Python interface to R/Bioconductor — pandas in, pandas out, .report() when you're done.
site_url: https://rosetta-bioc.github.io/rosetta/
repo_url: https://github.com/rosetta-bioc/rosetta
repo_name: rosetta-bioc/rosetta

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - API Reference:
      - "Tier 1: Quick API": api/tier1-quick.md
      - "Tier 2: Classes": api/tier2-classes.md
      - "Tier 3: Functional": api/tier3-functional.md
      - Results & Reporting: api/results.md
  - Guides:
      - DESeq2: guides/deseq2.md
      - edgeR: guides/edger.md
      - Enrichment (ORA & GSEA): guides/enrichment.md
      - Single-Cell (Seurat): guides/single-cell.md
      - Microbiome (phyloseq): guides/microbiome.md
  - Setup:
      - Installation: setup/install.md
      - R Packages: setup/r-packages.md
  - Contributing: contributing.md
