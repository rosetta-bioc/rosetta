name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  # Full test suite — requires R + Bioconductor
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    name: Tests (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.4"

      - name: Cache R packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-4.4-${{ hashFiles('install.R') }}
          restore-keys: |
            r-${{ runner.os }}-4.4-

      - name: Install R packages
        run: Rscript install.R

      - name: Install Python package
        run: pip install -e '.[dev,plots]'

      - name: Run tests
        env:
          RPY2_CFFI_MODE: API
        run: pytest --junitxml=results.xml

      - name: Report test results
        uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
        if: always()
        with:
          name: Pytest (Python ${{ matrix.python-version }})
          path: results.xml
          reporter: java-junit

  # Fast pure-Python tests — no R needed
  test-pure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Tests (pure Python)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Python package
        run: pip install --no-deps -e . && pip install pytest pandas numpy

      - name: Run pure-Python tests
        run: pytest tests/test_errors.py tests/test_init.py --junitxml=results.xml
