name: Publish Posit Cloud Demo

on:
  push:
    branches: [main]
    paths:
      - 'docs/posit-cloud-demo.Rmd'
      - 'docs/manifest.json'
      - '.github/workflows/publish-demo.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: rsconnect

      - name: Publish to Posit Connect Cloud
        env:
          CONNECT_SERVER: ${{ secrets.CONNECT_SERVER }}
          CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
        run: |
          Rscript -e '
            rsconnect::addServer(
              url = Sys.getenv("CONNECT_SERVER"),
              name = "connect-cloud"
            )
            rsconnect::connectApiUser(
              server = "connect-cloud",
              apiKey = Sys.getenv("CONNECT_API_KEY")
            )
            rsconnect::deployDoc(
              doc = "docs/posit-cloud-demo.Rmd",
              server = "connect-cloud",
              forceUpdate = TRUE
            )
          '
